<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Authentication Mastery</title>
  <desc id="desc">Backend auth, level by level: from passwords to enterprise SSO. 9 levels, 71 topics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0f1733"/>
      <stop offset="1" stop-color="#1b0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <!-- userSpaceOnUse: a horizontal line has a zero-height bounding box, so the default gradient units render nothing -->
    <linearGradient id="accentLine" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="1180" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a5a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#120c2a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
  <!-- background -->
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <circle cx="190" cy="180" r="190" fill="url(#glow)"/>
  <circle cx="1150" cy="60" r="220" fill="url(#glow2)"/>

  <!-- shield + keyhole -->
  <g>
    <path d="M190 62 L278 96 V178 C278 236 240 276 190 300 C140 276 102 236 102 178 V96 Z"
          fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M190 84 L258 110 V178 C258 224 229 256 190 276 C151 256 122 224 122 178 V110 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="190" cy="162" r="22" fill="url(#accent)"/>
    <path d="M178 176 L202 176 L210 228 L170 228 Z" fill="url(#accent)"/>
    <circle cx="190" cy="162" r="9" fill="#0f1733"/>
    <circle cx="190" cy="180" r="120" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2">
      <animate attributeName="r" values="120;140;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- badge -->
  <rect x="1056" y="34" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="1151" y="56" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" fill="#cbd5e1">9 levels · 71 topics</text>

  <!-- title -->
  <text x="360" y="140" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    <tspan fill="#f8fafc">Authentication </tspan><tspan fill="url(#accent)">Mastery</tspan>
  </text>
  <text x="362" y="188" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">Backend auth, level by level: from passwords to enterprise SSO</text>

  <!-- topic chips -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle">
    <g fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.45">
      <rect x="362" y="216" width="71" height="32" rx="8"/>
      <rect x="443" y="216" width="71" height="32" rx="8"/>
      <rect x="524" y="216" width="98" height="32" rx="8"/>
      <rect x="632" y="216" width="53" height="32" rx="8"/>
      <rect x="695" y="216" width="107" height="32" rx="8"/>
      <rect x="812" y="216" width="53" height="32" rx="8"/>
      <rect x="875" y="216" width="98" height="32" rx="8"/>
      <rect x="983" y="216" width="53" height="32" rx="8"/>
    </g>
    <text x="397.5" y="237">AuthN</text>
    <text x="478.5" y="237">AuthZ</text>
    <text x="573" y="237">Sessions</text>
    <text x="658.5" y="237">JWT</text>
    <text x="748.5" y="237">OAuth 2.0</text>
    <text x="838.5" y="237">MFA</text>
    <text x="924" y="237">Passkeys</text>
    <text x="1009.5" y="237">SSO</text>
  </g>

  <!-- level path -->
  <line x1="380" y1="310" x2="1180" y2="310" stroke="url(#accentLine)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="380" cy="310" r="5" fill="#ffffff">
    <animate attributeName="cx" values="380;1180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g fill="#0f1733" stroke="url(#accent)" stroke-width="3">
    <circle cx="380" cy="310" r="8"/>
    <circle cx="480" cy="310" r="8"/>
    <circle cx="580" cy="310" r="8"/>
    <circle cx="680" cy="310" r="8"/>
    <circle cx="780" cy="310" r="8"/>
    <circle cx="880" cy="310" r="8"/>
    <circle cx="980" cy="310" r="8"/>
    <circle cx="1080" cy="310" r="8"/>
    <circle cx="1180" cy="310" r="8"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#a78bfa" text-anchor="middle">
    <text x="380" y="292">L0</text><text x="480" y="292">L1</text><text x="580" y="292">L2</text>
    <text x="680" y="292">L3</text><text x="780" y="292">L4</text><text x="880" y="292">L5</text>
    <text x="980" y="292">L6</text><text x="1080" y="292">L7</text><text x="1180" y="292">L8</text>
  </g>
  <g font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="380" y="342">Basics</text><text x="480" y="342">Login</text><text x="580" y="342">Account</text>
    <text x="680" y="342">JWT</text><text x="780" y="342">AuthZ</text><text x="880" y="342">OAuth</text>
    <text x="980" y="342">MFA</text><text x="1080" y="342">Hardening</text><text x="1180" y="342">SSO</text>
  </g>

  <!-- footer status codes -->
  <text x="102" y="358" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#64748b">401 → login → 200 ✓</text>
  </g>
</svg>
